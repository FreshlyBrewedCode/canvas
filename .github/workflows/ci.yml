name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun run check

      # The web app the release workflow deploys to ui.canvas.frebreco.de.
      - run: bun run build

      # Stages and smoke-tests the npm package with a placeholder version, so a
      # staging failure is caught here rather than in the release job.
      - name: Stage the release package
        run: bun scripts/build-release.ts 0.0.0-development --smoke-test

  # The e2e tests (`e2e/`): a host and a guest in Chromium against Vite, a
  # `canvas relay` and a `canvas serve` per test; agents replay their recordings.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - run: bunx playwright install --with-deps chromium

      - run: bun run e2e

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The `canvas relay` image (ADR 0008): it builds, and answers /health.
  relay-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t canvas-relay .

      - run: |
          docker run -d --name relay -p 4419:4419 -e CANVAS_RELAY_KEYS=ci:secret canvas-relay
          for i in $(seq 20); do curl -fs http://127.0.0.1:4419/health && exit 0; sleep 1; done
          docker logs relay
          exit 1

  # `site/` is its own package; this proves a PR still builds the site that
  # site.yml deploys once it lands on main.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile
        working-directory: site

      - run: bun run build
        working-directory: site
